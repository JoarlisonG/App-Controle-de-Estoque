<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Estoque Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d0d10;
  --ink-2: #1a1a24;
  --ink-3: #272734;
  --muted: #52525e;
  --soft: #8888a0;
  --line: rgba(255,255,255,0.07);
  --paper: #f5f3ef;
  --gold: #c9a84c;
  --gold-light: #e8c96e;
  --emerald: #2ecc8a;
  --rose: #e05252;
  --iris: #7c6af0;
  --r: 20px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--ink);
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ——— AMBIENT BACKGROUND ——— */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 15% 0%, rgba(124,106,240,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 100%, rgba(201,168,76,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(46,204,138,0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Subtle grain */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}

.shell {
  position: relative;
  z-index: 1;
  max-width: 430px;
  margin: 0 auto;
  padding: 0 0 40px;
  min-height: 100vh;
}

/* ——— HEADER ——— */
.hd {
  padding: 24px 20px 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 28px;
}

.hd-left {}
.hd-eyebrow {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--soft);
  font-weight: 500;
  margin-bottom: 4px;
}
.hd-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.65rem;
  line-height: 1.1;
  background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.55));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hd-title em {
  font-style: italic;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hd-date {
  font-size: 0.65rem;
  color: var(--soft);
  margin-top: 6px;
  font-weight: 400;
}

.btn-theme {
  background: var(--ink-3);
  border: 1px solid var(--line);
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 1rem;
  transition: background 0.2s;
  flex-shrink: 0;
}
.btn-theme:active { background: var(--ink-2); }

/* ——— METRICS ROW ——— */
.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 16px;
  margin-bottom: 12px;
}

.metric-card {
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s;
}
.metric-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
}

.metric-label {
  font-size: 0.55rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--soft);
  font-weight: 600;
  margin-bottom: 8px;
}
.metric-value {
  font-family: 'DM Serif Display', serif;
  font-size: 1.3rem;
  line-height: 1;
}
.metric-value.gold { color: var(--gold-light); }
.metric-value.green { color: var(--emerald); }

.metric-sub {
  font-size: 0.58rem;
  color: var(--muted);
  margin-top: 6px;
}

/* ——— META CARD ——— */
.meta-card {
  margin: 0 16px 16px;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}

.meta-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.meta-lbl { font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); font-weight: 600; }
.meta-val { font-size: 0.65rem; color: var(--gold); cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 4px; }

.track {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 99px;
  overflow: hidden;
}
.track-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: 99px;
  width: 0%;
  transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
}

/* ——— SEARCH + FILTERS ——— */
.search-wrap {
  padding: 0 16px;
  margin-bottom: 12px;
  position: relative;
}
.search-icon {
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--soft);
  font-size: 0.85rem;
  pointer-events: none;
}
.search-wrap input {
  width: 100%;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px 12px 38px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: rgba(255,255,255,0.18); }
.search-wrap input::placeholder { color: var(--muted); }

.pills {
  display: flex;
  gap: 7px;
  padding: 0 16px;
  margin-bottom: 20px;
  overflow-x: auto;
}
.pills::-webkit-scrollbar { display: none; }

.pill {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--soft);
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 0.68rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 0.04em;
  transition: all 0.18s;
}
.pill.active {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.2);
  color: #fff;
}

/* ——— FORM PANEL ——— */
.panel {
  margin: 0 16px 20px;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
}

.panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-header-icon {
  width: 28px; height: 28px;
  background: rgba(124,106,240,0.15);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem;
}
.panel-title {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

.panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

.field-lbl {
  display: block;
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--soft);
  font-weight: 600;
  margin-bottom: 6px;
}
.field-input {
  width: 100%;
  background: var(--ink-3);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 11px 13px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  outline: none;
  transition: border-color 0.2s;
}
.field-input:focus { border-color: rgba(124,106,240,0.5); }
.field-input::placeholder { color: var(--muted); }
.field-input option { background: var(--ink); }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn-primary {
  background: linear-gradient(135deg, var(--iris), #5b50d0);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.04em;
  position: relative;
  overflow: hidden;
  transition: opacity 0.15s, transform 0.1s;
}
.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
  pointer-events: none;
}
.btn-primary:active { opacity: 0.85; transform: scale(0.98); }

/* ——— PRODUCT CARDS ——— */
.list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

.prod-card {
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  overflow: hidden;
  animation: slideUp 0.28s ease both;
}
@keyframes slideUp {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}

.prod-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 0 2px 2px 0;
}
.prod-card.producao::before { background: var(--iris); }
.prod-card.revenda::before { background: #60a5fa; }

.prod-avatar {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.prod-card.producao .prod-avatar { background: rgba(124,106,240,0.15); }
.prod-card.revenda   .prod-avatar { background: rgba(96,165,250,0.15); }

.prod-info { flex: 1; min-width: 0; }
.prod-name {
  font-weight: 700;
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}
.prod-price { font-size: 0.72rem; color: var(--gold-light); font-weight: 600; margin-bottom: 4px; }
.prod-stock {
  font-size: 0.65rem;
  color: var(--soft);
  display: flex; align-items: center; gap: 6px;
}
.stock-badge {
  background: rgba(46,204,138,0.12);
  color: var(--emerald);
  border-radius: 6px;
  padding: 2px 7px;
  font-weight: 700;
  font-size: 0.6rem;
}
.stock-badge.low {
  background: rgba(224,82,82,0.12);
  color: var(--rose);
}

.prod-actions { display: flex; gap: 5px; align-items: center; }

.btn-sell {
  background: linear-gradient(135deg, var(--gold), #b8922a);
  color: #0d0d10;
  border: none;
  width: 56px; height: 56px;
  border-radius: 14px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 800;
  font-size: 0.6rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  transition: transform 0.1s, opacity 0.15s;
  flex-shrink: 0;
}
.btn-sell .sell-num { font-size: 1.1rem; font-family: 'DM Serif Display', serif; line-height: 1; }
.btn-sell:active:not(:disabled) { transform: scale(0.93); }
.btn-sell:disabled { opacity: 0.3; cursor: not-allowed; }

.prod-sub-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.btn-ghost {
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.65rem;
  cursor: pointer;
  font-weight: 500;
  display: flex; align-items: center; gap: 3px;
}
.btn-ghost:hover { color: rgba(255,255,255,0.7); }
.btn-ghost.danger:hover { color: var(--rose); }

/* ——— TOOLS SECTION ——— */
.tools-section {
  margin: 20px 16px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.section-lbl {
  font-size: 0.58rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 4px;
  padding-left: 2px;
}
.tool-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.btn-tool {
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  color: rgba(255,255,255,0.6);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  transition: background 0.15s, border-color 0.15s;
  letter-spacing: 0.02em;
}
.btn-tool:active { background: var(--ink-3); }
.btn-tool-icon { font-size: 1.1rem; }
.btn-tool.accent { border-color: rgba(201,168,76,0.25); }
.btn-tool.accent .btn-tool-icon { }
.btn-tool.blue { border-color: rgba(96,165,250,0.2); }

/* ——— HISTORY ——— */
.history-section {
  margin: 20px 16px 0;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
}
.history-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
}
.history-title { font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: rgba(255,255,255,0.6); }

.hist-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background 0.12s;
}
.hist-row:last-child { border-bottom: none; }
.hist-row:active { background: rgba(255,255,255,0.03); }
.hist-date { font-size: 0.68rem; color: var(--soft); }
.hist-amount { font-family: 'DM Serif Display', serif; font-size: 0.9rem; color: var(--gold-light); }
.hist-arrow { color: var(--muted); font-size: 0.6rem; }

/* ——— MODAL ——— */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(12px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.overlay.open { display: flex; }

.modal {
  background: var(--ink-2);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 28px 28px 20px 20px;
  width: 100%;
  max-width: 420px;
  padding: 24px;
  max-height: 85vh;
  overflow-y: auto;
  animation: modalIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  position: relative;
}
.modal::before {
  content: '';
  display: block;
  width: 36px; height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 99px;
  margin: 0 auto 20px;
}

@keyframes modalIn {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

.modal-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.2rem;
  margin-bottom: 6px;
  text-align: center;
}
.modal-sub { font-size: 0.78rem; color: var(--soft); text-align: center; margin-bottom: 20px; line-height: 1.5; }

.modal-field { margin-bottom: 12px; }

.modal-report {
  background: var(--ink-3);
  border-radius: 14px;
  padding: 14px;
  margin: 12px 0 20px;
  display: none;
}
.report-row { display: flex; justify-content: space-between; font-size: 0.72rem; padding: 5px 0; color: rgba(255,255,255,0.7); border-bottom: 1px solid var(--line); }
.report-row:last-child { border: none; font-weight: 700; color: #fff; padding-top: 10px; margin-top: 4px; }
.report-date { font-size: 0.6rem; color: var(--muted); margin-bottom: 10px; }

.modal-btns { display: flex; gap: 10px; }
.btn-cancel {
  flex: 1; padding: 13px;
  background: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: rgba(255,255,255,0.6);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-confirm {
  flex: 1; padding: 13px;
  background: linear-gradient(135deg, var(--iris), #5b50d0);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
}
.btn-confirm.danger { background: linear-gradient(135deg, var(--rose), #c04444); }
.btn-confirm.gold { background: linear-gradient(135deg, var(--gold), #b8922a); color: #0d0d10; }

.btn-copy-hist {
  display: none;
  margin-top: 12px;
  width: 100%;
  background: rgba(201,168,76,0.12);
  border: 1px solid rgba(201,168,76,0.25);
  border-radius: 12px;
  padding: 12px;
  color: var(--gold-light);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}

/* ——— EMPTY STATE ——— */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
.empty-text { font-size: 0.78rem; line-height: 1.6; }

/* ——— TOAST ——— */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30,30,40,0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 99px;
  padding: 10px 20px;
  font-size: 0.75rem;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 9999;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <div class="hd">
    <div class="hd-left">
      <div class="hd-eyebrow">Gestão de Negócio</div>
      <div class="hd-title">Estoque <em>Pro</em></div>
      <div class="hd-date" id="hdDate"></div>
    </div>
  </div>

  <!-- METRICS -->
  <div class="metrics">
    <div class="metric-card">
      <div class="metric-label">Faturamento</div>
      <div class="metric-value gold" id="fatReal">R$ 0,00</div>
      <div class="metric-sub">receita do dia</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Lucro Líquido</div>
      <div class="metric-value green" id="lucReal">R$ 0,00</div>
      <div class="metric-sub">após custos</div>
    </div>
  </div>

  <!-- META -->
  <div class="meta-card">
    <div class="meta-top">
      <div class="meta-lbl">Meta Diária</div>
      <div class="meta-val" id="metaStatus" onclick="abrirModalMeta()">Definir ⚙</div>
    </div>
    <div class="track">
      <div class="track-fill" id="metaFill"></div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="busca" placeholder="Buscar produto..." oninput="render()">
  </div>

  <!-- FILTERS -->
  <div class="pills">
    <button class="pill active" onclick="filtrar('todos',this)">Todos</button>
    <button class="pill" onclick="filtrar('producao',this)">Produção</button>
    <button class="pill" onclick="filtrar('revenda',this)">Revenda</button>
  </div>

  <!-- ADD FORM -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-header-icon">✦</div>
      <div class="panel-title">Cadastrar Produto</div>
    </div>
    <div class="panel-body">
      <div>
        <label class="field-lbl">Modelo de Negócio</label>
        <select class="field-input" id="tipo" onchange="toggleForm()">
          <option value="producao">Produção — eu fabrico</option>
          <option value="revenda">Revenda — compra e venda</option>
        </select>
      </div>
      <div>
        <label class="field-lbl">Nome do Produto</label>
        <input class="field-input" type="text" id="nome" placeholder="Ex: iPhone 15, Camiseta...">
      </div>
      <div class="row-2">
        <div>
          <label class="field-lbl" id="labelCusto">Gasto Produção</label>
          <input class="field-input" type="number" id="custo" placeholder="0.00">
        </div>
        <div>
          <label class="field-lbl">Estoque</label>
          <input class="field-input" type="number" id="qtd" value="1">
        </div>
      </div>
      <div>
        <label class="field-lbl">Preço de Venda (un.)</label>
        <input class="field-input" type="number" id="venda" placeholder="0.00">
      </div>
      <button class="btn-primary" onclick="adicionar()">＋ Cadastrar Produto</button>
    </div>
  </div>

  <!-- PRODUCT LIST -->
  <div class="list" id="lista"></div>

  <!-- TOOLS -->
  <div class="tools-section">
    <div class="section-lbl">Ferramentas</div>
    <div class="tool-row">
      <button class="btn-tool accent" onclick="copiarRelatorioAtual()">
        <span class="btn-tool-icon">📋</span>
        Copiar Relatório
      </button>
      <button class="btn-tool blue" onclick="gerarBackup()">
        <span class="btn-tool-icon">💾</span>
        Gerar Backup
      </button>
    </div>
    <div class="tool-row">
      <button class="btn-tool" onclick="abrirModalImportar()">
        <span class="btn-tool-icon">📥</span>
        Restaurar Backup
      </button>
      <button class="btn-tool" onclick="abrirModalReset()">
        <span class="btn-tool-icon">🧹</span>
        Zerar Caixa
      </button>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="history-section" id="histSec" style="display:none">
    <div class="history-header">
      <div>📅</div>
      <div class="history-title">Últimos Fechamentos</div>
    </div>
    <div id="histLista"></div>
  </div>

</div><!-- /shell -->

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-sub" id="mSub" style="display:none"></div>
    <div class="modal-report" id="mReport"></div>

    <div id="mInputs" style="display:none; flex-direction:column; gap:10px; margin-bottom:20px;">
      <div class="modal-field" id="mfNome" style="display:none">
        <label class="field-lbl">Nome</label>
        <input class="field-input" type="text" id="editNome">
      </div>
      <div class="modal-field" id="mfVenda" style="display:none">
        <label class="field-lbl">Preço de Venda</label>
        <input class="field-input" type="number" id="editVenda">
      </div>
      <div class="modal-field" id="mfMeta" style="display:none">
        <label class="field-lbl">Valor da Meta (R$)</label>
        <input class="field-input" type="number" id="inputMeta">
      </div>
      <div class="modal-field" id="mfBackup" style="display:none">
        <label class="field-lbl">Código do Backup</label>
        <input class="field-input" type="text" id="inputBackup" placeholder="Cole o código aqui...">
      </div>
    </div>

    <div class="modal-btns" id="mBtns">
      <button class="btn-cancel" onclick="fecharModal()">Voltar</button>
      <button class="btn-confirm" id="mConfirm">Confirmar</button>
    </div>
    <button class="btn-copy-hist" id="btnCopiarHist">📋 Copiar este Fechamento</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
let produtos = JSON.parse(localStorage.getItem('stk_v16')) || [];
let fat = parseFloat(localStorage.getItem('ft_v16')) || 0;
let cst = parseFloat(localStorage.getItem('cs_v16')) || 0;
let historico = JSON.parse(localStorage.getItem('hist_v16')) || [];
let metaDiaria = parseFloat(localStorage.getItem('meta_v16')) || 0;
let filtroAtual = 'todos';

// Date
const now = new Date();
document.getElementById('hdDate').textContent = now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

// Theme (light mode basic support preserved)
function toggleTheme() {
  const b = document.body, cur = b.getAttribute('data-t');
  const next = cur === 'light' ? 'dark' : 'light';
  b.setAttribute('data-t', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('th_v16', next);
}
if(localStorage.getItem('th_v16')==='light') toggleTheme();

// Filters
function filtrar(tipo, btn) {
  filtroAtual = tipo;
  document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// Toast
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

// Modal helpers
function resetModal() {
  document.getElementById('mSub').style.display='none';
  document.getElementById('mReport').style.display='none';
  document.getElementById('mInputs').style.display='none';
  document.getElementById('mBtns').style.display='flex';
  document.getElementById('btnCopiarHist').style.display='none';
  document.getElementById('mConfirm').className='btn-confirm';
  document.getElementById('mConfirm').style.display='block';
  ['mfNome','mfVenda','mfMeta','mfBackup'].forEach(id=>document.getElementById(id).style.display='none');
}

function abrirModal(titulo, confirmCb, opts={}) {
  resetModal();
  document.getElementById('mTitle').textContent = titulo;
  const overlay = document.getElementById('overlay');
  overlay.classList.add('open');
  if(opts.sub) { document.getElementById('mSub').textContent=opts.sub; document.getElementById('mSub').style.display='block'; }
  if(opts.confirmClass) document.getElementById('mConfirm').className='btn-confirm '+opts.confirmClass;
  if(opts.confirmLabel) document.getElementById('mConfirm').textContent=opts.confirmLabel;
  if(opts.noConfirm) document.getElementById('mConfirm').style.display='none';
  document.getElementById('mConfirm').onclick = () => { if(confirmCb) confirmCb(); fecharModal(); };
}

function fecharModal() { document.getElementById('overlay').classList.remove('open'); }

// Meta
function abrirModalMeta() {
  abrirModal("Meta Diária", () => {
    metaDiaria = parseFloat(document.getElementById('inputMeta').value)||0;
    salvar();
  }, { confirmLabel: 'Salvar' });
  document.getElementById('mInputs').style.display='flex';
  document.getElementById('mfMeta').style.display='block';
  document.getElementById('inputMeta').value = metaDiaria;
}

// Import backup
function abrirModalImportar() {
  abrirModal("Restaurar Backup", () => {
    const token = document.getElementById('inputBackup').value.trim();
    try {
      const d = JSON.parse(atob(token));
      produtos=d.produtos; fat=d.fat; cst=d.cst; historico=d.historico; metaDiaria=d.metaDiaria||0;
      salvar(); toast("✅ Dados restaurados!");
    } catch(e) { toast("❌ Código inválido."); }
  }, { confirmLabel: 'Restaurar' });
  document.getElementById('mInputs').style.display='flex';
  document.getElementById('mfBackup').style.display='block';
  document.getElementById('inputBackup').value='';
}

// Edit
function editarProduto(id) {
  const p = produtos.find(i=>i.id===id);
  abrirModal("Editar Produto", () => {
    p.nome = document.getElementById('editNome').value;
    p.vendaUnit = parseFloat(document.getElementById('editVenda').value)||p.vendaUnit;
    salvar();
  }, { confirmLabel: 'Salvar' });
  document.getElementById('mInputs').style.display='flex';
  document.getElementById('mfNome').style.display='block';
  document.getElementById('mfVenda').style.display='block';
  document.getElementById('editNome').value=p.nome;
  document.getElementById('editVenda').value=p.vendaUnit;
}

// Delete
function confirmarExclusao(id) {
  const p = produtos.find(i=>i.id===id);
  abrirModal("Remover Produto", () => { produtos=produtos.filter(i=>i.id!==id); salvar(); },
    { sub: `Deseja remover "${p.nome}" do estoque?`, confirmClass: 'danger', confirmLabel: 'Remover' });
}

// Reset caixa
function abrirModalReset() {
  if(fat===0) { toast("ℹ️ O caixa já está zerado."); return; }
  abrirModal("Zerar Caixa", () => {
    const data = new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const itens = produtos.filter(p=>p.vendidos>0).map(p=>({nome:p.nome,qtd:p.vendidos,valor:(p.vendaUnit*p.vendidos).toFixed(2)}));
    historico.unshift({data,fat:fat.toFixed(2),luc:(fat-cst).toFixed(2),itens});
    if(historico.length>10) historico.pop();
    fat=0; cst=0; produtos.forEach(p=>p.vendidos=0); salvar();
    toast("🧹 Caixa zerado e salvo no histórico.");
  }, { sub: 'O dia será fechado e salvo no histórico.', confirmClass: 'danger', confirmLabel: 'Zerar Agora' });
}

// History detail
function verDetalhesHist(idx) {
  const h = historico[idx];
  abrirModal("Fechamento do Dia", null, { noConfirm: true });
  const el = document.getElementById('mReport');
  el.style.display='block';
  let html = `<div class="report-date">${h.data}</div>`;
  let texto = `📊 FECHAMENTO ${h.data}\n\n`;
  h.itens.forEach(it => {
    html += `<div class="report-row"><span>${it.nome} ×${it.qtd}</span><span>R$ ${it.valor}</span></div>`;
    texto += `• ${it.nome} (×${it.qtd}): R$ ${it.valor}\n`;
  });
  html += `<div class="report-row"><span>Total</span><span>R$ ${h.fat}</span></div>`;
  texto += `\n💰 TOTAL: R$ ${h.fat}\n📈 LUCRO: R$ ${h.luc}`;
  el.innerHTML=html;
  document.getElementById('btnCopiarHist').style.display='block';
  document.getElementById('btnCopiarHist').onclick=()=>copiarTexto(texto);
  document.getElementById('mBtns').style.display='none';
}

// Helpers
function toggleForm() {
  document.getElementById('labelCusto').textContent = document.getElementById('tipo').value==='revenda' ? 'Preço de Compra' : 'Gasto Produção';
}

function adicionar() {
  const n=document.getElementById('nome').value.trim(), c=parseFloat(document.getElementById('custo').value),
        q=parseInt(document.getElementById('qtd').value)||1, v=parseFloat(document.getElementById('venda').value);
  if(!n||isNaN(c)||isNaN(v)) { toast("⚠️ Preencha todos os campos."); return; }
  produtos.push({id:Date.now(),tipo:document.getElementById('tipo').value,nome:n,custoUnit:c/q,vendaUnit:v,qtdEstoque:q,vendidos:0});
  salvar(); limpar(); toast("✅ Produto cadastrado!");
}

function vender(id) {
  const p=produtos.find(i=>i.id===id);
  if(p.qtdEstoque>0) { p.qtdEstoque--; p.vendidos++; fat+=p.vendaUnit; cst+=p.custoUnit; salvar(); toast(`✔ ${p.nome} vendido!`); }
}

function copiarRelatorioAtual() {
  let t=`📊 RELATÓRIO ATUAL (${new Date().toLocaleDateString()})\n\n`;
  produtos.forEach(p=>{if(p.vendidos>0||p.qtdEstoque>0) t+=`${p.nome}: ${p.qtdEstoque} estoque | ${p.vendidos} vendidos\n`;});
  t+=`\n💰 TOTAL: R$ ${fat.toFixed(2)}\n📈 LUCRO: R$ ${(fat-cst).toFixed(2)}`;
  copiarTexto(t);
}

function copiarTexto(txt) {
  navigator.clipboard.writeText(txt).then(()=>toast("📋 Copiado para o teclado!"));
}

function gerarBackup() {
  const token=btoa(JSON.stringify({produtos,fat,cst,historico,metaDiaria}));
  copiarTexto(token);
  toast("💾 Backup copiado!");
}

function getEmoji(tipo) { return tipo==='producao' ? '🔧' : '🏷️'; }

function salvar() {
  localStorage.setItem('stk_v16',JSON.stringify(produtos));
  localStorage.setItem('ft_v16',fat);
  localStorage.setItem('cs_v16',cst);
  localStorage.setItem('hist_v16',JSON.stringify(historico));
  localStorage.setItem('meta_v16',metaDiaria);
  render();
}

function render() {
  document.getElementById('fatReal').textContent = `R$ ${fat.toFixed(2)}`;
  document.getElementById('lucReal').textContent = `R$ ${(fat-cst).toFixed(2)}`;

  const perc = metaDiaria>0 ? Math.min((fat/metaDiaria)*100,100) : 0;
  document.getElementById('metaFill').style.width = perc+'%';
  document.getElementById('metaStatus').textContent = metaDiaria>0 ? `R$ ${fat.toFixed(0)} / R$ ${metaDiaria.toFixed(0)} ⚙` : 'Definir ⚙';

  const b=document.getElementById('busca').value.toLowerCase();
  const filtrados=produtos.filter(p=>p.nome.toLowerCase().includes(b)&&(filtroAtual==='todos'||p.tipo===filtroAtual));

  const lista = document.getElementById('lista');

  if(filtrados.length===0) {
    lista.innerHTML=`<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">Nenhum produto aqui.<br>Cadastre o primeiro item acima.</div></div>`;
  } else {
    lista.innerHTML = filtrados.map(p=>`
      <div class="prod-card ${p.tipo}">
        <div class="prod-avatar">${getEmoji(p.tipo)}</div>
        <div class="prod-info" style="flex:1;">
          <div class="prod-name">${p.nome}</div>
          <div class="prod-price">R$ ${p.vendaUnit.toFixed(2)} / un.</div>
          <div class="prod-stock">
            <span class="stock-badge ${p.qtdEstoque<3?'low':''}">
              ${p.qtdEstoque} em estoque
            </span>
            <span>${p.vendidos} vendido${p.vendidos!==1?'s':''}</span>
          </div>
          <div class="prod-sub-actions">
            <button class="btn-ghost" onclick="editarProduto(${p.id})">✏ Editar</button>
            <button class="btn-ghost danger" onclick="confirmarExclusao(${p.id})">✕ Remover</button>
          </div>
        </div>
        <button class="btn-sell" onclick="vender(${p.id})" ${p.qtdEstoque===0?'disabled':''}>
          <div class="sell-num">+1</div>
          <div>VENDI</div>
        </button>
      </div>
    `).join('');
  }

  if(historico.length>0) {
    document.getElementById('histSec').style.display='block';
    document.getElementById('histLista').innerHTML=historico.map((h,i)=>`
      <div class="hist-row" onclick="verDetalhesHist(${i})">
        <span class="hist-date">${h.data}</span>
        <span class="hist-amount">R$ ${h.fat}</span>
        <span class="hist-arrow">›</span>
      </div>`).join('');
  }
}

function limpar() {
  document.getElementById('nome').value='';
  document.getElementById('custo').value='';
  document.getElementById('venda').value='';
  document.getElementById('qtd').value=1;
}

render();
</script>
</body>
</html>
